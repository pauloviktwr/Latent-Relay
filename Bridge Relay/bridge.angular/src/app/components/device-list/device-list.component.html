<div class="device-list-container">
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
    <h1>Dispositivos</h1>
    <button type="button" (click)="toggleMockData()">
      Modo: {{ useMockData ? 'Mock' : 'API' }}
    </button>
  </div>

  <!-- 1. Carregamento -->
  <div *ngIf="isLoading" class="loading">
    <p>Carregando ...</p>
  </div>

  <!-- 2. Erro -->
  <div *ngIf="errorMessage" class="error">
    <p>{{ errorMessage }}</p>
  </div>

  <!-- 3. Lista de Dispositivos (Só renderiza se houver itens) -->
  <div *ngIf="!isLoading && devices.length" class="devices-list">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Slots</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let device of devices">
          <td>{{ device.id }}</td>
          <td>{{ device.name }}</td>
          <td>{{ device.slotToAssetMap ? (device.slotToAssetMap | json) : '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 4. Sem Dados (Verifica se está carregado, sem erro, mas a lista é vazia) -->
  <div *ngIf="!isLoading && !errorMessage && devices.length === 0" class="no-data">
    <p>Nenhum dispositivo encontrado.</p>
  </div>
</div>
